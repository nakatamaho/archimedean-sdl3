name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu GCC/Ninja
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ninja
        run: >-
          sudo apt-get update && sudo apt-get install --yes ninja-build
          libx11-dev libxext-dev libxrandr-dev libxfixes-dev libxcursor-dev
          libxi-dev libxss-dev libwayland-dev libxkbcommon-dev
          libegl1-mesa-dev libgl-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Validate committed JSON
        run: python tools/validate_archimedean.py data/archimedean.json

      - name: Run headless viewer self-test
        run: ./build/archimedean_viewer --selftest --data data/archimedean.json

  windows:
    name: Windows MSYS2 UCRT64/Ninja
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON -DSDL_SHARED=OFF -DSDL_STATIC=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure

      - name: Validate committed JSON
        run: python tools/validate_archimedean.py data/archimedean.json

      - name: Run headless viewer self-test
        run: ./build/archimedean_viewer.exe --selftest --data data/archimedean.json
